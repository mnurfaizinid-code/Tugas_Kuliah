<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tugas JavaScript</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h2>Masukkan umurmu dan hadapilah kenyataan</h2>
  <label for="tahun">Masukkan Tahun Lahir:</label>
  <input type="number" id="tahun" placeholder="contoh: 2000">
  <button onclick="hitungUmur()">Hitung</button>

  <p id="hasil"></p>

  <hr>

  <h2>Masukkan nilaimu dan hadapilah kenyataan</h2>
  <label for="nilai">Masukkan Nilai (0 - 100):</label>
  <input type="number" id="nilai" placeholder="contoh: 85">
  <button onclick="cekNilai()">Cek Nilai</button>

  <p id="hasilNilai"></p>

  <script src="script.js"></script>

</body>
</html>
