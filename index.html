<body>
  <h2>Mari hitung umur anda</h2>
  <label for="tahun">Masukkan Tahun Lahir:</label>
  <input type="number" id="tahun" placeholder="contoh: 2000">
  <button onclick="hitungUmur()">Hitung</button>

  <p id="hasil"></p>

  <script>
    function hitungUmur() {
      let tahunLahirInput = document.getElementById("tahun").value;
      let tahunSekarang = new Date().getFullYear();
      let elemenHasil = document.getElementById("hasil");

      if (tahunLahirInput === "") {
        elemenHasil.innerHTML = "Harap masukkan tahun lahir!";
        return;
      }

      let tahunLahir = Number(tahunLahirInput);

      if (tahunLahir > tahunSekarang) {
        elemenHasil.innerHTML = "Sekarang masih 2026 mas, yang bener aja";
        return;
      }

      let umur = tahunSekarang - tahunLahir;
      elemenHasil.innerHTML = "Umur kamu sekarang adalah " + umur + " tahun.";
    }
  </script>
</body>
